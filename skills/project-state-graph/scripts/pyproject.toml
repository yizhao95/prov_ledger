[project]
name = "project-graph"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "provledger",
    "pytest>=9.0.3",
    "tree-sitter>=0.25.2",
    "tree-sitter-css>=0.25.0",
    "tree-sitter-html>=0.23.2",
    "tree-sitter-javascript>=0.25.0",
    "tree-sitter-python>=0.25.0",
]

[tool.pytest.ini_options]
markers = [
    "llm_consistency: needs a live model; never in CI (deselected by default, run with -m llm_consistency)",
]
addopts = "-m 'not llm_consistency'"
# scenario fixtures are synthetic projects with their own tests/ package —
# collecting them would shadow this suite's `tests` package
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", ".venv", "__pycache__", "fixtures"]

[tool.uv.sources]
# The host API (graph_api / providers / testing) lives in the provledger package;
# the analyzer's own environment carries it editable so `uv run python -m analyzer`
# can import third-party providers that import provledger (phase 6, acceptance C).
provledger = { path = "../../../orchestrator-backend", editable = true }
