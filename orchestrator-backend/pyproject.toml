[project]
name = "provledger"
version = "0.3.0"
description = "Decision provenance for coding agents: why each change exists — your words, the reference behind them, the agent's reading — recorded as it happens, and surfaced before anyone undoes it"
requires-python = ">=3.10"
dependencies = []  # stdlib only — pandas is optional (profiler.profile_dataframe imports it lazily)
license = { text = "MIT" }
authors = [{ name = "yizhao95", email = "yzhao950213@gmail.com" }]
keywords = ["data-contracts", "provenance", "llm-agents", "data-quality", "drift-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.scripts]
provledger = "provledger.cli:main"

[project.urls]
Homepage = "https://github.com/yizhao95/prov_ledger"
Documentation = "https://github.com/yizhao95/prov_ledger#readme"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# The wheel installs a single top-level `provledger` package, mapped from the
# in-repo `orchestrator/` source dir (all internal imports are relative, so the
# code is name-agnostic — no generic `orchestrator` name squatted in
# site-packages). Repo-internal code, skills, and tests keep importing
# `orchestrator` via pythonpath; only the built artifact uses `provledger`.
# tests/ stays excluded from discovery (SQL data + test code, not packages).
packages = ["provledger", "provledger.artifacts", "provledger.ask", "provledger.providers", "provledger.testing"]
package-dir = { "provledger" = "orchestrator", "provledger.artifacts" = "orchestrator/artifacts", "provledger.ask" = "orchestrator/ask", "provledger.providers" = "orchestrator/providers", "provledger.testing" = "orchestrator/testing" }

[tool.setuptools.package-data]
# Migrations live inside the package so run_migrations works from a wheel;
# the mutation corpus ships with provledger.testing (phase 6).
provledger = ["migrations/*.sql"]
"provledger.testing" = ["corpus/**/*", "corpus/**/.gitignore", "prompts/*.md"]

[dependency-groups]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v -m 'not live'"
markers = [
    "veto: an acceptance item whose failure fails the whole suite (decision provenance §12); never skipped",
    "degraded: the hooks-only mode — asserts what is lost without the skills, explicitly (DP phase 2, Task 7b)",
    "live: MANUAL — runs against the real ~/skill-workspace ledger and state graph, so its verdict depends on who ran plans on this machine; deselected by default, never CI. Run it with PROVLEDGER_LIVE=1 (DP phases 2e and 2c)",
]
