[case]
name = "class_methods"
symbols = ["pkg.trainer.Trainer", "pkg.trainer.Trainer.fit", "pkg.trainer.Trainer.predict", "pkg.trainer.main", "pkg.trainer.entry"]

[generated]
rename_variable = { identity = "preserved", semantic_diff = "none" }
rename_function = { identity = "preserved", semantic_diff = "callers", renamed = ["pkg.trainer.main"] }
strip_comments  = { identity = "preserved", semantic_diff = "none" }
add_comments    = { identity = "preserved", semantic_diff = "none" }
reformat        = { identity = "preserved", semantic_diff = "none" }

[variants]
# Trainer -> Estimator: class and both method qualified names change, bodies intact.
rename_class                   = { identity = "preserved", semantic_diff = "none", via = "struct_sig", symbols = ["pkg.trainer.Trainer", "pkg.trainer.Trainer.fit", "pkg.trainer.Trainer.predict"] }
# predict becomes a module-level function taking `model` instead of `self`: its
# body changes (self.model -> model), so neither the qualname nor the structural
# layer can pair it — a break. Locks the boundary on purpose.
move_method_to_module_function = { identity = "broken", broken = ["pkg.trainer.Trainer.predict"] }
delete_function                = { identity = "broken", broken = ["pkg.trainer.main"] }
# truth: declared by the author of the variant — the swap was applied by hand, so the
# answer is known by construction (phase 8 calibration set, FL-041).
swap_two_similar               = { identity = "ambiguous", symbols = ["pkg.trainer.Trainer.score_a", "pkg.trainer.Trainer.score_b"], truth = { "pkg.trainer.Trainer.score_a" = "pkg.trainer.Trainer.eval_x", "pkg.trainer.Trainer.score_b" = "pkg.trainer.Trainer.eval_y" } }
