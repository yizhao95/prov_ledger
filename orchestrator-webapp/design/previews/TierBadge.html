<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TierBadge — provLedger Design</title>
<link rel="stylesheet" href="../dist/styles.css">
<style>
  main { max-width: 880px; margin: 0 auto; padding: 24px; }
  header h1 { font-size: 1.125rem; font-weight: 600; margin: 0 0 4px; }
  header p { font-size: .75rem; color: var(--pl-brand-muted); margin: 0 0 24px; }
  section[data-variant] { margin: 0 0 28px; }
  .variant-label { font-size: .6875rem; text-transform: uppercase; letter-spacing: .06em;
                   color: var(--pl-brand-muted); font-weight: 500; margin: 0 0 8px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>TierBadge</h1>
    <p>五档 tier。标签才是区分手段，颜色只是加强——灰度下也读得出来。</p>
  </header>
  <section data-variant="五档并排">
    <h2 class="variant-label">五档并排</h2>
    <div data-host="0"></div>
  </section>
  <section data-variant="未知值退回 unstated">
    <h2 class="variant-label">未知值退回 unstated</h2>
    <div data-host="1"></div>
  </section>
</main>
<script src="../dist/_ds_bundle.js"></script>
<script>
  var D = window.ProvLedgerDS, React = D.__React;
  D.__render(React.createElement('div',{style:{display:'flex',gap:6,flexWrap:'wrap'}},['observed','derived','asserted','stated','unstated'].map(function(t){return React.createElement(D.TierBadge,{key:t,tier:t});})), document.querySelector('[data-host="0"]'));
  D.__render(React.createElement(D.TierBadge,{tier:'nonsense'}), document.querySelector('[data-host="1"]'));
</script>
</body>
</html>
