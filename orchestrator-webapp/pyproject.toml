[project]
name = "orchestrator-webapp"
version = "0.1.0"
description = "Localhost dashboard for the provLedger orchestrator SQLite DB"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[dependency-groups]
# what `$PY -m pytest orchestrator-webapp` needs beyond the runtime: FastAPI's
# TestClient is built on httpx (root requirements.txt carries the same floors)
dev = ["pytest>=7", "httpx>=0.27"]
